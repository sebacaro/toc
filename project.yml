name: toc
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.seba
  xcodeVersion: "16.2"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  toc:
    type: application
    platform: macOS
    sources:
      - toc
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seba.toc
        PRODUCT_NAME: toc
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_FILE: toc/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: toc/App/toc.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_APP_SANDBOX: false
    dependencies:
      - package: KeyboardShortcuts

  tocTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - tocTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seba.toc.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: toc

schemes:
  toc:
    build:
      targets:
        toc: all
        tocTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - tocTests
    archive:
      config: Release
